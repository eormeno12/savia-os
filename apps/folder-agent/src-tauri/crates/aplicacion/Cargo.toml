# `ciclo` (el lazo: barrer/drenar) y `panel` (la bandeja). El unico crate que compone a
# la vez plataforma, almacen y protocolo — la misma forma que `@savia-os/orchestration`
# tiene en el pipeline de ingesta.
[package]
name = "savia-folder-aplicacion"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "savia_folder_aplicacion"
path = "src/lib.rs"

[dependencies]
savia-folder-contrato = { path = "../contrato" }
savia-folder-estado = { path = "../estado" }
savia-folder-maquina = { path = "../maquina" }
savia-folder-politica = { path = "../politica" }
savia-folder-protocolo = { path = "../protocolo" }
serde.workspace = true
# El facade de logging — `a_desenlace` (`ciclo.rs`) lo usa para no dejar en silencio un
# `Desenlace::Credenciales`/`Reintentable`/`Rechazado`, que hasta ahora no dejaba ningun
# rastro. Sin backend instalado (nadie en este crate ni en sus tests lo instala) estas
# llamadas no hacen nada — el backend real vive en `src/bin/bandeja/main.rs`.
log.workspace = true

[dev-dependencies]
savia-folder-plataforma-falsa = { path = "../plataforma-falsa" }
serde_json.workspace = true
