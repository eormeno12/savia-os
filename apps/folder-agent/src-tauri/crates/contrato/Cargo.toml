# El vocabulario: dominio, hash, parametros, y la parte de plataforma/inventario/colas/
# protocolo/salvaguardas que es forma pura, sin logica de caso de uso. Los dos puertos
# (`Plataforma`, `Inventario`) viven aca — es la crate mas adentro del corte.
# Ver docs/product/savia-b2b/plan-rediseno-agente.md §2 "El corte".
#
# NO es cero-deps como packages/ir: a diferencia de TypeScript, Rust necesita `serde`
# para derivar (De)Serialize y `sha2` porque `HuellaDeRaiz::raiz_id` lo llama. Juega el
# mismo ROL igual: vocabulario puro, cero logica de adaptador o de caso de uso.
[package]
name = "savia-folder-contrato"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "savia_folder_contrato"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
sha2 = "0.10"
