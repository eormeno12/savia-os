# Los guardianes de texto que abarcan el workspace entero — lo que ninguna reasignacion
# por crate puede resolver (un conteo global, un barrido de dieciocho archivos en nueve
# crates, un chequeo de cobertura de recorrido). Sin [lib]: solo corre `cargo test`.
# Camina las crates hermanas por ruta relativa desde su propio CARGO_MANIFEST_DIR — la
# misma tecnica que `fuentes_fuera_del_binario_de_ventana` ya usaba, con un nivel mas de
# indireccion. Ver docs/product/savia-b2b/plan-rediseno-agente.md §2.
[package]
name = "savia-folder-guardianes"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# SOLO PARA `tests/canal_de_savia.rs`, el guardian de FASE 2(a) que prueba por tipos
# —no por texto— que `ciclo::drenar` acepta cualquier `CanalDeSavia`, no el struct
# `Cliente` por nombre. Los guardianes de `guardianes.rs` siguen sin dependencias: solo
# leen fuentes con `std::fs`.
[dev-dependencies]
savia-folder-aplicacion = { path = "../aplicacion" }
savia-folder-protocolo = { path = "../protocolo" }
savia-folder-contrato = { path = "../contrato" }
savia-folder-politica = { path = "../politica" }
savia-folder-estado = { path = "../estado" }
savia-folder-plataforma-falsa = { path = "../plataforma-falsa" }
