# El deposito: redb, una transaccion por punto de control. `estado` y `contrato` porque
# `Deposito` guarda un `Almacen` completo y un `Secreto` de vinculacion.
[package]
name = "savia-folder-persistencia"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "savia_folder_persistencia"
path = "src/lib.rs"

[dependencies]
savia-folder-contrato = { path = "../contrato" }
savia-folder-estado = { path = "../estado" }
redb = "2"
serde_json.workspace = true

# Solo para tests: `estado_con_dos_filas()` arma su fixture pasando por `ciclo::barrer`
# contra la plataforma falsa, para no duplicar en este crate la logica que ya prueba
# `aplicacion`. No hay ciclo real: `aplicacion` no depende de `persistencia`.
[dev-dependencies]
savia-folder-aplicacion = { path = "../aplicacion" }
savia-folder-plataforma-falsa = { path = "../plataforma-falsa" }
savia-folder-politica = { path = "../politica" }
