name: savia

# Cap container log files so they never fill the host disk on a long-running EC2.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---- backing services ----
  postgres:
    # postgres 17.10 — pinned by digest for reproducible builds
    image: postgres:17@sha256:2203e6282d9e7de7c24d7da234e2a744fb325df366a3fd8ed940e8abbee39527
    environment:
      POSTGRES_USER: savia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-savia}
      POSTGRES_DB: savia
    # Bound to localhost only: reachable from host dev processes, never from outside.
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U savia -d savia"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *default-logging

  redis:
    # redis 7.4.9 — pinned by digest
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redisdata:/data"]
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *default-logging

  qdrant:
    # qdrant v1.18.1 — pinned by digest; matches @qdrant/js-client-rest 1.18.x
    image: qdrant/qdrant:v1.18.1@sha256:45f8e3ddc2570a4d029877e1b5ec1045c19b3852b4e22a55c7f43b05aea0ca89
    ports: ["127.0.0.1:6333:6333"]
    volumes: ["qdrantdata:/qdrant/storage"]
    # The qdrant image ships no wget/curl — only bash. Use bash's /dev/tcp to
    # confirm the REST port is accepting connections.
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *default-logging

  # ---- application services (profile "full"; backings start without profile) ----
  api:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: legacy/api/Dockerfile
    command: ["node", "dist/main.js"]
    env_file: [./.env]
    environment:
      HOST: "0.0.0.0"
      DATABASE_URL: "postgresql://savia:${POSTGRES_PASSWORD:-savia}@postgres:5432/savia"
      REDIS_URL: "redis://redis:6379"
      QDRANT_URL: "http://qdrant:6333"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      qdrant: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4400/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  worker:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: legacy/api/Dockerfile
    command: ["node", "dist/worker.js"]
    env_file: [./.env]
    environment:
      DATABASE_URL: "postgresql://savia:${POSTGRES_PASSWORD:-savia}@postgres:5432/savia"
      REDIS_URL: "redis://redis:6379"
      QDRANT_URL: "http://qdrant:6333"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      qdrant: { condition: service_healthy }
    restart: unless-stopped
    logging: *default-logging

  mcp:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: legacy/api/Dockerfile
    command: ["node", "dist/mcp.js"]
    env_file: [./.env]
    environment:
      HOST: "0.0.0.0"
      DATABASE_URL: "postgresql://savia:${POSTGRES_PASSWORD:-savia}@postgres:5432/savia"
      REDIS_URL: "redis://redis:6379"
      QDRANT_URL: "http://qdrant:6333"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      qdrant: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4401/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  # ---- gateway: only service exposed to internet ----
  gateway:
    profiles: ["full"]
    # caddy 2.11.4 — pinned by digest
    image: caddy:2-alpine@sha256:c2af7d9004854180322ffd6f81b918874cee01f629084ab4d8ac0b96aa442432
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - api
      - mcp
    restart: unless-stopped
    logging: *default-logging

volumes:
  pgdata: {}
  redisdata: {}
  qdrantdata: {}
  caddydata: {}
  caddyconfig: {}
