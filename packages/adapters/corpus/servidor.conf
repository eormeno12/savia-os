# Configuración del worker de ingesta.
# Este archivo es el caso que el piso de texto existe para atrapar: es texto puro
# y su extensión no la reclama ningún adaptador, ni la va a reclamar nunca.

[worker]
concurrencia = 4
reintentos = 3

# El bloque de abajo está separado por una línea en blanco a propósito: es la única
# estructura que un archivo de texto tiene, y es por donde el piso corta.
[almacenamiento]
bucket = savia-documentos
region = sa-east-1
