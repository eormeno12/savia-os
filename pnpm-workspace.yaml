packages:
  # Línea principal — B2B
  - 'apps/*'
  - 'packages/*'
  # Congelado — el producto B2C. Se lee como referencia, no se le escribe.
  - 'legacy/*'
  # Experimentos y forks. No forman parte del producto.
  - 'lab/*'
allowBuilds:
  '@google/genai': false
  '@prisma/client': true
  '@prisma/engines': true
  argon2: true
  better-sqlite3: true
  esbuild: false
  msgpackr-extract: true
  prisma: true
  protobufjs: true
  puppeteer: false
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - mem0ai@3.1.0
